name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      # Phase 0 has no migrations, so this only has to be well-formed.
      # Phase 1 adds a postgres service and `prisma migrate deploy`.
      DATABASE_URL: postgresql://test:test@localhost:5432/wowo_external_test
      DIRECT_URL: postgresql://test:test@localhost:5432/wowo_external_test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: TypeScript compilation check
        run: npm run typecheck

      - name: Run tests
        run: npm test
